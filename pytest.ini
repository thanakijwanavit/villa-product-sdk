# vps-7af: one offline test gate. `python3 -m pytest` (and `make test`) runs tests/ without AWS: anything that calls
# real Lambda/S3 is marked @pytest.mark.live and skipped unless asked for (`make test-live`, i.e. -m live).
# --strict-markers turns an unregistered (mistyped) marker into an error, so a live test cannot slip into the
# default run under another name. A pytest.ini rather than pyproject.toml: vps-3ug's pyproject.toml is build-system only.
[pytest]
testpaths = tests
addopts = -m "not live" --strict-markers
markers =
    live: calls real AWS (Lambda, S3) with credentials; deselected by default, run with: make test-live
